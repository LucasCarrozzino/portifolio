<div>
    <div class="card">
        @if (data.imageSrc) {        
        <img src={{data.imageSrc}} alt="" style="display: block; width: 100%; border-radius: 12px;">}
        <section>
            <div class="divTitle">
                <h2 style="margin-left: 20px;">{{data.title}}</h2>
                <app-tag class="tag" [status]="data.status"></app-tag>
            </div>
                <h3 style="margin-left: 20px;">{{data.description}}</h3>
                <div style="margin-left: 40px;">
                    <img style="height: 30px;width: 30px;" src="assets/github-mark-white.svg" alt="">
                </div>
            </section>
    </div>
</div>
